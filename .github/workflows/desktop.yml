name: Build Windows candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate and package Windows
        run: npm run build -- --win nsis
      - name: Upload candidate installer
        uses: actions/upload-artifact@v4
        with:
          name: one-more-move-windows
          path: dist/desktop/*.exe
          if-no-files-found: error
