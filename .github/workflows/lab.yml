name: Laboratory Benchmark

on:
  push:
    branches:
      - feat/omm-2-web-first
    paths:
      - app/game.js
      - app/grid.js
      - app/ai.js
      - app/config.js
      - app/generation.js
      - app/movement.js
      - app/progression.js
      - app/state.js
      - app/storage.js
      - app/presentation.js
      - scripts/lab.js
      - scripts/run-lab.js
      - scripts/run-tactical.js
      - scripts/survival.js
      - tests/survival.test.js
      - .github/workflows/lab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deterministic runtime
        run: npm test
      - name: Run matched-seed benchmark
        run: npm run lab:benchmark
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: one-more-move-benchmark
          path: dist/lab/results.json
          if-no-files-found: error

      - name: Evaluate experimental tactical AI against baseline
        run: npm run lab:tactical
      - name: Upload tactical comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: one-more-move-tactical
          path: dist/lab/tactical.json
          if-no-files-found: error

      - name: Evaluate held-out seeds with censor-aware bounds
        run: npm run lab:heldout
      - name: Upload held-out comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: one-more-move-heldout
          path: dist/lab/held-out.json
          if-no-files-found: error

      - name: Compare Hardcore containment against frozen v2
        run: npm run lab:containment
      - name: Upload containment evidence
        uses: actions/upload-artifact@v4
        with:
          name: one-more-move-containment
          path: dist/lab/containment.json
          if-no-files-found: error
