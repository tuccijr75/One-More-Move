name: Core Validation

on:
  push:
    branches:
      - main
      - fix/core-stability
      - feat/omm-2-web-first
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source
        run: npm run check

      - name: Upload verified web distribution
        uses: actions/upload-artifact@v4
        with:
          name: one-more-move-web
          path: dist/web/
          if-no-files-found: error
