name: AI Decision Audit

on:
  push:
    branches:
      - feat/omm-2-web-first
    paths:
      - app/ai.js
      - app/grid.js
      - app/config.js
      - app/generation.js
      - app/state.js
      - app/movement.js
      - app/progression.js
      - app/game.js
      - scripts/lab.js
      - scripts/audit-ai.js
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare candidates on actual simulated turn inputs
        run: npm run lab:audit
      - name: Upload decision audit
        uses: actions/upload-artifact@v4
        with:
          name: one-more-move-audit
          path: dist/lab/audit.json
          if-no-files-found: error
