name: AI Planner Profile

on:
  push:
    branches:
      - feat/omm-2-web-first
    paths:
      - app/ai.js
      - app/grid.js
      - app/config.js
      - app/generation.js
      - app/state.js
      - app/game.js
      - scripts/profile-ai.js
      - .github/workflows/profile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Profile deterministic team planning
        run: npm run lab:profile
      - name: Upload profile evidence
        uses: actions/upload-artifact@v4
        with:
          name: one-more-move-profile
          path: dist/lab/profile.json
          if-no-files-found: error
