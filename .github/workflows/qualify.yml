name: AI Stage Qualification

on:
  push:
    branches:
      - feat/omm-2-web-first
    paths:
      - app/ai.js
      - app/grid.js
      - app/config.js
      - app/generation.js
      - app/progression.js
      - app/state.js
      - scripts/qualify-ai.js
      - .github/workflows/qualify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical stage progression and candidate plans
        run: npm run lab:qualify
      - name: Upload stage qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: one-more-move-qualification
          path: dist/lab/qualification.json
          if-no-files-found: error
